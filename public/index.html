<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a5c2a">
  <title>SHAMBA ASSISTANT</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --green-900: #103717;
      --green-800: #1a5c2a;
      --green-700: #28733a;
      --green-mid: #4b9d60;
      --gold: #f5a623;
      --surface: #f4faf4;
      --panel: rgba(255, 255, 255, 0.82);
      --panel-strong: rgba(255, 255, 255, 0.94);
      --text: #17331c;
      --muted: #607764;
      --line: rgba(26, 92, 42, 0.13);
      --shadow: 0 18px 48px rgba(26, 92, 42, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #0d1910;
        --panel: rgba(16, 31, 19, 0.86);
        --panel-strong: rgba(20, 37, 23, 0.96);
        --text: #eef8ef;
        --muted: #a9c2ad;
        --line: rgba(255, 255, 255, 0.08);
        --shadow: 0 18px 48px rgba(0, 0, 0, 0.3);
      }
    }

    body.force-dark {
      --surface: #0d1910;
      --panel: rgba(16, 31, 19, 0.86);
      --panel-strong: rgba(20, 37, 23, 0.96);
      --text: #eef8ef;
      --muted: #a9c2ad;
      --line: rgba(255, 255, 255, 0.08);
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      font-family: "Nunito", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(245, 166, 35, 0.14), transparent 20%),
        radial-gradient(circle at top right, rgba(94, 165, 255, 0.1), transparent 22%),
        linear-gradient(160deg, #edf8ee 0%, #d8eddc 42%, #a9cfae 100%);
    }

    body.force-dark {
      background:
        radial-gradient(circle at top left, rgba(245, 166, 35, 0.14), transparent 22%),
        radial-gradient(circle at top right, rgba(94, 165, 255, 0.08), transparent 24%),
        linear-gradient(160deg, #0a130b 0%, #112016 40%, #193022 100%);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .page {
      min-height: 100vh;
      padding: 0;
    }

    .shell {
      width: min(1220px, 100%);
      margin: 0 auto;
      min-height: 100vh;
      background: rgba(255, 255, 255, 0.34);
      border: 1px solid rgba(255, 255, 255, 0.38);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding: 8px 14px;
      background: linear-gradient(135deg, rgba(26, 92, 42, 0.98), rgba(20, 71, 31, 0.96));
      color: #fff;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.14);
      font-size: 18px;
      flex: 0 0 auto;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.1;
      white-space: nowrap;
    }

    .header-actions,
    .lang-switch {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .lang-btn,
    .ghost-btn,
    .call-btn,
    .action-btn,
    .icon-btn,
    .send-btn,
    .stop-inline-btn {
      font-family: inherit;
      transition: background 0.18s ease, opacity 0.18s ease, transform 0.18s ease;
    }

    .lang-btn,
    .ghost-btn {
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      font-size: 11px;
      font-weight: 800;
    }

    .lang-btn.active {
      background: #fff;
      color: var(--green-800);
    }

    .call-btn {
      padding: 6px 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, #f5c33c, #f08a21);
      color: #17331c;
      font-size: 11px;
      font-weight: 800;
    }

    .content {
      display: grid;
      gap: 8px;
      padding: 8px 10px 10px;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }

    .status-card {
      min-width: 0;
      padding: 4px 12px;
      border-radius: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      font-size: 10px;
      white-space: nowrap;
      overflow: hidden;
    }

    .status-card small,
    .status-card strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-card small {
      color: var(--muted);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .status-card strong {
      margin-top: 2px;
      font-size: 10px;
      font-weight: 800;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #58f47d;
      box-shadow: 0 0 0 4px rgba(88, 244, 125, 0.12);
      flex: 0 0 auto;
    }

    .location-bar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .field,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel-strong);
      color: var(--text);
      outline: none;
    }

    .field {
      height: 32px;
      padding: 5px 10px;
      font-size: 12px;
    }

    .action-btn {
      height: 32px;
      padding: 5px 10px;
      border-radius: 12px;
      background: var(--panel-strong);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
    }

    .quick-actions {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .quick-chip {
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--panel-strong);
      border: 1px solid var(--line);
      color: var(--green-800);
      font-size: 10px;
      font-weight: 800;
    }

    .speaking-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      padding: 3px 10px;
      border-radius: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      font-size: 11px;
    }

    .wave-box {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .wave-meta {
      min-width: 0;
    }

    .wave-meta > div {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .wave {
      display: flex;
      align-items: end;
      gap: 3px;
      height: 16px;
      flex: 0 0 auto;
    }

    .wave span {
      width: 4px;
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--gold), var(--green-700));
      opacity: 0.45;
    }

    .speaking .wave span {
      animation: wave 0.9s ease-in-out infinite;
    }

    .speaking .wave span:nth-child(2) { animation-delay: 0.08s; }
    .speaking .wave span:nth-child(3) { animation-delay: 0.16s; }
    .speaking .wave span:nth-child(4) { animation-delay: 0.24s; }
    .speaking .wave span:nth-child(5) { animation-delay: 0.32s; }

    @keyframes wave {
      0%, 100% { height: 5px; opacity: 0.5; }
      50% { height: 16px; opacity: 1; }
    }

    .stop-speaking-btn {
      display: none;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(184, 51, 51, 0.12);
      border: 1px solid rgba(184, 51, 51, 0.2);
      color: #b83333;
      font-size: 11px;
      font-weight: 800;
    }

    .stop-speaking-btn.show {
      display: inline-flex;
    }

    .chat-card {
      display: grid;
      grid-template-rows: auto 1fr auto;
      border-radius: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .chat-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      padding: 6px 10px;
      border-bottom: 1px solid var(--line);
    }

    .chat-head strong {
      font-size: 12px;
    }

    .chat-tools {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .thread {
      max-height: 55vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      background: rgba(26, 92, 42, 0.12);
      border: 1px solid var(--line);
      flex: 0 0 auto;
    }

    .message-stack {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      max-width: 88%;
    }

    .message.user .message-stack {
      align-items: flex-end;
    }

    .bubble {
      max-width: 100%;
      padding: 8px 12px;
      border-radius: 16px;
      font-size: 13px;
      line-height: 1.55;
      box-shadow: 0 8px 20px rgba(16, 55, 23, 0.06);
      word-break: break-word;
    }

    .message.user .bubble {
      background: linear-gradient(135deg, var(--green-700), var(--green-800));
      color: #fff;
      border-bottom-right-radius: 6px;
    }

    .message.bot .bubble {
      background: var(--panel-strong);
      border: 1px solid var(--line);
      border-bottom-left-radius: 6px;
    }

    .bubble p + p {
      margin-top: 6px;
    }

    .bubble ul,
    .bubble ol {
      margin-top: 6px;
      padding-left: 18px;
    }

    .bubble table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 12px;
    }

    .bubble th,
    .bubble td {
      text-align: left;
      border-bottom: 1px solid var(--line);
      padding: 6px 4px;
    }

    .cursor {
      display: inline-block;
      animation: blink 0.7s step-end infinite;
      color: var(--green-mid);
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .stop-inline-btn {
      display: none;
      padding: 4px 12px;
      border-radius: 20px;
      background: #fff3e0;
      border: 1.5px solid #f5a623;
      color: #e65100;
      font-size: 11px;
      font-weight: 800;
      align-self: flex-start;
    }

    .stop-inline-btn.show {
      display: inline-flex;
    }

    .composer {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 8px;
      align-items: end;
      padding: 6px 10px;
      border-top: 1px solid var(--line);
    }

    textarea {
      min-height: 36px;
      max-height: 140px;
      resize: none;
      padding: 8px 10px;
      font-size: 12px;
    }

    .icon-btn,
    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: var(--panel-strong);
      border: 1px solid var(--line);
      color: var(--green-800);
      font-size: 14px;
      font-weight: 800;
    }

    .send-btn {
      background: linear-gradient(135deg, var(--green-700), var(--green-800));
      color: #fff;
      border-color: transparent;
    }

    .icon-btn.active {
      background: rgba(75, 157, 96, 0.16);
    }

    .call-modal {
      position: fixed;
      inset: 0;
      background: rgba(3, 12, 6, 0.56);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 30;
    }

    .call-modal.show {
      display: flex;
    }

    .call-sheet {
      width: min(430px, 100%);
      border-radius: 24px;
      padding: 18px;
      background: linear-gradient(180deg, rgba(14, 44, 20, 0.98), rgba(26, 92, 42, 0.97));
      color: #fff;
      box-shadow: var(--shadow);
      display: grid;
      gap: 14px;
    }

    .call-transcript {
      min-height: 180px;
      max-height: 250px;
      overflow: auto;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 12px;
      display: grid;
      gap: 8px;
      font-size: 12px;
    }

    .call-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .call-control {
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
    }

    .call-control.hangup {
      background: #b83333;
      border-color: #b83333;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 900px) {
      .status-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .shell {
        width: 100%;
        border-radius: 0;
      }

      .status-grid {
        grid-template-columns: 1fr;
      }

      .location-bar {
        grid-template-columns: 1fr;
      }

      .thread {
        max-height: 50vh;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="shell">
      <header class="header">
        <div class="brand">
          <span class="brand-icon">🌾</span>
          <span class="brand-title" id="title-text">Shamba Assistant</span>
        </div>
        <div class="header-actions">
          <div class="lang-switch" id="lang-switch"></div>
          <button class="ghost-btn" id="theme-btn">🌙</button>
          <button class="call-btn" id="open-call-btn">📞 Call Shamba</button>
        </div>
      </header>

      <main class="content">
        <section class="status-grid">
          <article class="status-card">
            <small id="status-ai-label">AI Status</small>
            <strong class="status-pill"><span class="dot"></span><span id="status-ai-value">Online and ready</span></strong>
          </article>
          <article class="status-card">
            <small id="status-location-label">Current Location</small>
            <strong id="status-location-value">Nairobi, Kenya</strong>
          </article>
          <article class="status-card">
            <small id="status-weather-label">Weather Summary</small>
            <strong id="status-weather-value">Loading...</strong>
          </article>
          <article class="status-card">
            <small id="status-market-label">Market Status</small>
            <strong id="status-market-value">Loading prices...</strong>
          </article>
        </section>

        <section class="location-bar">
          <input class="field" id="location-input" type="text" value="Nairobi, Kenya" placeholder="Type any city">
          <button class="action-btn" id="update-location-btn">Update</button>
          <button class="action-btn" id="gps-btn">GPS</button>
        </section>

        <section class="quick-actions">
          <button class="quick-chip quick-chip-btn" data-prompt="crop">🌱 Crop Recommendations</button>
          <button class="quick-chip quick-chip-btn" data-prompt="weather">🌦 Weather</button>
          <button class="quick-chip quick-chip-btn" data-prompt="market">💹 Market Prices</button>
          <button class="quick-chip quick-chip-btn" data-prompt="soil">🟤 Soil Analysis</button>
          <button class="quick-chip quick-chip-btn" data-prompt="pest">🐛 Pest Control</button>
        </section>

        <section class="speaking-bar" id="speaking-bar">
          <div class="wave-box">
            <div class="wave" aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
            <div class="wave-meta">
              <div id="voice-status">Voice ready.</div>
              <div id="language-status">Current language: English</div>
            </div>
          </div>
          <button class="stop-speaking-btn" id="stop-speaking-btn">⏹ Stop</button>
        </section>

        <section class="chat-card">
          <div class="chat-head">
            <strong id="chat-title">Main Chat</strong>
            <div class="chat-tools">
              <button class="action-btn" id="continuous-btn">Continuous: Off</button>
              <button class="action-btn" id="clear-chat-btn">Clear Chat</button>
            </div>
          </div>

          <div class="thread" id="thread"></div>

          <div class="composer">
            <button class="icon-btn" id="mic-btn" title="Voice input">🎙</button>
            <textarea id="message-input" placeholder="Ask about crops, livestock, pests, markets, weather, or soil"></textarea>
            <button class="send-btn" id="send-btn" title="Send">➤</button>
          </div>
        </section>
      </main>
    </div>
  </div>

  <section class="call-modal" id="call-modal">
    <div class="call-sheet">
      <div>
        <h3 id="call-title">Shamba Call</h3>
        <p><span id="call-number">+254 700 SHAMBA</span> • <span id="call-timer">00:00</span></p>
      </div>
      <div class="call-transcript" id="call-transcript"></div>
      <div class="call-controls">
        <button class="call-control" id="call-mic-btn">🎙 Talk</button>
        <button class="call-control" id="call-mute-btn">🔇 Mute</button>
        <button class="call-control" id="call-speaker-btn">🔊 Speaker</button>
        <button class="call-control hangup" id="call-hangup-btn">📴 Hang up</button>
      </div>
    </div>
  </section>

      },
      luo: {
        title: "Shamba Assistant",
        aiStatus: "Kit AI",
        aiOnline: "Osebedo gi kikelo kony",
        location: "Kama In",
        weather: "Weche mar Koth",
        market: "Kit Soko",
        locationPlaceholder: "Ndik dala moro amora",
        updateLocation: "Yik Manyien",
        gps: "GPS",
        mainChat: "Goyo Weche Madongo",
        continuousOn: "Winjo Kendo: Ee",
        continuousOff: "Winjo Kendo: Da",
        clearChat: "Jwa Weche",
        messagePlaceholder: "Penja kuom mazao, dhiang', chwiri, soko, koth, kata ngom",
        voiceReady: "Dwol oikore.",
        voiceListening: "Awinjo...",
        voiceSpeaking: "Awacho...",
        languageStatus: "Dho ma sani: Luo-Dholuo",
        loadingPrices: "Tiyo kuom bei...",
        callTitle: "Go mar Shamba",
        callGreeting: "Go olor. Penja penji mari mar puodho bang' dwol.",
        callMuted: "Ling'",
        callUnmuted: "Wek",
        callSpeaker: "Speaker",
        callEarpiece: "Ear",
        locationUpdated: location => `Aseketo weche mar puodhi e ${location}.`,
        welcome: "Misawa. An Shamba Assistant. Penja kuom mazao, koth, ngom, dhiang', chwiri, kudho pi, yath mar puodho, kata soko.",
        quickPrompts: {
          crop: "Nyisa mazao adek maber ma nyal pandore kanyo sani kod sababu.",
          weather: "Nyisa weche mar koth mar sani kod ndalo 7 mabiro e kama ni.",
          market: "Nyisa bei mar soko manyien kod gima gikelo e yueyo mazao.",
          soil: "Lony ni nonro mar ngom ni to ginyalo konyo nadi e pandruok.",
          pest: "Chwiri mane ma nyaka arit sani kod ango mar ketho gi?"
        }
      }
    };

    const voiceLocales = {
      en: "en-US",
      sw: "sw-KE",
      luo: "luo"
    };

    const voicePriority = {
      en: ["en-KE", "en-US", "en-GB"],
      sw: ["sw-KE", "sw", "en-KE"],
      luo: ["en-KE", "en-ZA", "en-GB"]
    };

    const state = {
      sessionId: `session-${Math.random().toString(36).slice(2)}`,
      language: "en",
      currentLocation: "Nairobi, Kenya",
      lat: null,
      lon: null,
      currentWeather: null,
      currentSoil: null,
      currentPrices: null,
      recognition: null,
      listening: false,
      speaking: false,
      continuousListening: false,
      callOpen: false,
      callMuted: false,
      callSpeaker: true,
      callTimer: null,
      callSeconds: 0,
      config: null,
      activeStream: null
    };

    function t(key) {
      return I18N[state.language][key];
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatText(text) {
      return escapeHtml(text)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/^###\s(.+)$/gm, "<strong>$1</strong>");
    }

    function markdownToHtml(text) {
      const lines = String(text || "").split(/\n/);
      let html = "";
      let inList = false;
      for (const line of lines) {
        if (/^\s*[-*]\s+/.test(line)) {
          if (!inList) {
            html += "<ul>";
            inList = true;
          }
          html += `<li>${formatText(line.replace(/^\s*[-*]\s+/, ""))}</li>`;
          continue;
        }
        if (inList) {
          html += "</ul>";
          inList = false;
        }
        if (!line.trim()) {
          html += "<br>";
          continue;
        }
        html += `<p>${formatText(line)}</p>`;
      }
      if (inList) {
        html += "</ul>";
      }
      return html;
    }

    function autoResize(element) {
      element.style.height = "auto";
      element.style.height = `${Math.min(element.scrollHeight, 140)}px`;
    }

    function appendCallTranscript(text) {
      const item = document.createElement("div");
      item.textContent = text;
      $("#call-transcript").appendChild(item);
      $("#call-transcript").scrollTop = $("#call-transcript").scrollHeight;
    }

    function setStreamingBubbleContent(target, text, showCursor) {
      target.innerHTML = `${markdownToHtml(text)}${showCursor ? '<span class="cursor">▌</span>' : ""}`;
    }

    function appendUserMessage(text) {
      const row = document.createElement("div");
      row.className = "message user";
      const stack = document.createElement("div");
      stack.className = "message-stack";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = markdownToHtml(text);
      stack.appendChild(bubble);
      row.appendChild(stack);
      $("#thread").appendChild(row);
      $("#thread").scrollTop = $("#thread").scrollHeight;
      if (state.callOpen) {
        appendCallTranscript(`Farmer: ${text}`);
      }
    }

    function appendBotMessage(text) {
      const row = document.createElement("div");
      row.className = "message bot";
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "🌾";
      const stack = document.createElement("div");
      stack.className = "message-stack";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = markdownToHtml(text);
      stack.appendChild(bubble);
      row.appendChild(avatar);
      row.appendChild(stack);
      $("#thread").appendChild(row);
      $("#thread").scrollTop = $("#thread").scrollHeight;
      if (state.callOpen) {
        appendCallTranscript(`Shamba: ${text}`);
      }
      speak(text);
    }

    function createStreamingBotMessage() {
      const row = document.createElement("div");
      row.className = "message bot";
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "🌾";
      const stack = document.createElement("div");
      stack.className = "message-stack";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      const stopButton = document.createElement("button");
      stopButton.className = "stop-inline-btn show";
      stopButton.type = "button";
      stopButton.textContent = "⏹ Stop Generating";
      setStreamingBubbleContent(bubble, "", true);
      stack.appendChild(bubble);
      stack.appendChild(stopButton);
      row.appendChild(avatar);
      row.appendChild(stack);
      $("#thread").appendChild(row);
      $("#thread").scrollTop = $("#thread").scrollHeight;
      return { row, bubble, stopButton };
    }

    function finalizeActiveStream({ keepText = true, speakText = false } = {}) {
      if (!state.activeStream) {
        return "";
      }
      const active = state.activeStream;
      const finalText = keepText ? active.text : "";
      setStreamingBubbleContent(active.bubble, finalText, false);
      active.stopButton.classList.remove("show");
      state.activeStream = null;
      if (active.stopButton.parentNode) {
        active.stopButton.remove();
      }
      if (speakText && finalText.trim()) {
        if (state.callOpen) {
          appendCallTranscript(`Shamba: ${finalText}`);
        }
        speak(finalText);
      }
      return finalText;
    }

    async function stopActiveStream() {
      if (!state.activeStream) {
        return;
      }
      const active = state.activeStream;
      try {
        if (active.reader) {
          await active.reader.cancel();
        }
      } catch (_error) {}
      if (active.controller) {
        active.controller.abort();
      }
      finalizeActiveStream({ keepText: true, speakText: false });
    }

    function renderLanguageSwitch() {
      $("#lang-switch").innerHTML = ["en", "sw", "luo"]
        .map(lang => `<button class="lang-btn ${lang === state.language ? "active" : ""}" data-lang="${lang}">${lang.toUpperCase()}</button>`)
        .join("");
      $$(".lang-btn").forEach(button => {
        button.addEventListener("click", () => switchLanguage(button.dataset.lang));
      });
    }

    function renderStaticText() {
      document.documentElement.lang = state.language === "luo" ? "luo" : state.language;
      $("#title-text").textContent = t("title");
      $("#status-ai-label").textContent = t("aiStatus");
      $("#status-ai-value").textContent = t("aiOnline");
      $("#status-location-label").textContent = t("location");
      $("#status-weather-label").textContent = t("weather");
      $("#status-market-label").textContent = t("market");
      $("#location-input").placeholder = t("locationPlaceholder");
      $("#update-location-btn").textContent = t("updateLocation");
      $("#gps-btn").textContent = t("gps");
      $("#chat-title").textContent = t("mainChat");
      $("#continuous-btn").textContent = state.continuousListening ? t("continuousOn") : t("continuousOff");
      $("#clear-chat-btn").textContent = t("clearChat");
      $("#message-input").placeholder = t("messagePlaceholder");
      $("#voice-status").textContent = state.listening ? t("voiceListening") : state.speaking ? t("voiceSpeaking") : t("voiceReady");
      $("#language-status").textContent = t("languageStatus");
      $("#call-title").textContent = t("callTitle");
      $("#open-call-btn").textContent = "📞 Call Shamba";
      renderLanguageSwitch();
    }

    function weatherSummaryText() {
      if (!state.currentWeather) {
        return "Loading...";
      }
      return `${state.currentWeather.current.temperatureC ?? "--"}°C • ${state.currentWeather.current.description || "--"}`;
    }

    function priceStatusText() {
      if (!state.currentPrices) {
        return t("loadingPrices");
      }
      const when = new Date(state.currentPrices.updatedAt).toLocaleTimeString();
      return `${state.currentPrices.source} • ${when}`;
    }

    function renderStatus() {
      $("#status-location-value").textContent = state.currentLocation;
      $("#status-weather-value").textContent = weatherSummaryText();
      $("#status-market-value").textContent = priceStatusText();
      $("#language-status").textContent = t("languageStatus");
    }

    async function fetchJson(url, options) {
      const response = await fetch(url, options);
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error || "Request failed");
      }
      return data;
    }

    async function loadConfig() {
      state.config = await fetchJson("/api/config");
      state.currentLocation = state.config.defaultLocation || state.currentLocation;
      $("#location-input").value = state.currentLocation;
      $("#call-number").textContent = state.config.phoneNumber || "+254 700 SHAMBA";
      state.continuousListening = Boolean(state.config.continuousListeningDefault);
    }

    async function refreshPrices() {
      state.currentPrices = await fetchJson("/api/prices");
      renderStatus();
    }

    async function refreshContext(notify = false) {
      const params = new URLSearchParams({ location: state.currentLocation });
      if (state.lat !== null && state.lon !== null) {
        params.set("lat", String(state.lat));
        params.set("lon", String(state.lon));
      }
      const [weather, soil] = await Promise.all([
        fetchJson(`/api/weather?${params.toString()}`),
        fetchJson(`/api/soil?${params.toString()}`)
      ]);
      state.currentWeather = weather;
      state.currentSoil = soil;
      state.currentLocation = weather.location || state.currentLocation;
      $("#location-input").value = state.currentLocation;
      renderStatus();
      if (notify) {
        appendBotMessage(I18N[state.language].locationUpdated(state.currentLocation));
      }
    }

    function chooseVoice() {
      const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
      const wanted = voicePriority[state.language];
      return voices.find(voice => wanted.includes(voice.lang))
        || voices.find(voice => wanted.some(lang => (voice.lang || "").startsWith(lang.split("-")[0])))
        || null;
    }

    function stopSpeaking() {
      if (!("speechSynthesis" in window)) {
        return;
      }
      window.speechSynthesis.cancel();
      state.speaking = false;
      $("#speaking-bar").classList.remove("speaking");
      $("#stop-speaking-btn").classList.remove("show");
      $("#voice-status").textContent = state.listening ? t("voiceListening") : t("voiceReady");
    }

    function speak(text) {
      if (!("speechSynthesis" in window) || state.callMuted) {
        return;
      }
      stopSpeaking();
      const utterance = new SpeechSynthesisUtterance(String(text || "").replace(/\*\*/g, ""));
      utterance.lang = voiceLocales[state.language];
      utterance.rate = 0.95;
      utterance.pitch = 1.05;
      utterance.volume = 1.0;
      const voice = chooseVoice();
      if (voice) {
        utterance.voice = voice;
        utterance.lang = voice.lang;
      }
      utterance.onstart = () => {
        state.speaking = true;
        $("#speaking-bar").classList.add("speaking");
        $("#stop-speaking-btn").classList.add("show");
        $("#voice-status").textContent = t("voiceSpeaking");
      };
      utterance.onend = () => {
        state.speaking = false;
        $("#speaking-bar").classList.remove("speaking");
        $("#stop-speaking-btn").classList.remove("show");
        $("#voice-status").textContent = state.listening ? t("voiceListening") : t("voiceReady");
        if (state.continuousListening && !state.callOpen) {
          startListening();
        }
      };
      utterance.onerror = utterance.onend;
      window.speechSynthesis.speak(utterance);
    }

    function resetConversation() {
      stopActiveStream();
      state.sessionId = `session-${Math.random().toString(36).slice(2)}`;
      $("#thread").innerHTML = "";
      appendBotMessage(t("welcome"));
    }

    async function sendMessage(rawMessage) {
      const message = String(rawMessage || "").trim();
      if (!message) {
        return;
      }

      await stopActiveStream();
      appendUserMessage(message);

      const streamingUi = createStreamingBotMessage();
      const controller = new AbortController();
      const active = {
        controller,
        reader: null,
        bubble: streamingUi.bubble,
        stopButton: streamingUi.stopButton,
        text: ""
      };
      state.activeStream = active;

      streamingUi.stopButton.addEventListener("click", async () => {
        await stopActiveStream();
      });

      try {
        const payload = {
          message,
          sessionId: state.sessionId,
          language: state.language,
          location: state.currentLocation,
          lat: state.currentWeather?.coordinates?.lat ?? state.lat,
          lon: state.currentWeather?.coordinates?.lon ?? state.lon
        };

        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          signal: controller.signal
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(errorData.error || "Request failed");
        }

        if (!response.body) {
          throw new Error("Streaming is not available.");
        }

        const reader = response.body.getReader();
        active.reader = reader;
        const decoder = new TextDecoder();
        let buffer = "";
        let streaming = true;

        while (streaming) {
          const { done, value } = await reader.read();
          if (done) {
            break;
          }
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split(/\r?\n/);
          buffer = parts.pop() || "";

          for (const line of parts) {
            if (!line.startsWith("data:")) {
              continue;
            }
            const data = line.slice(5).trimStart();
            if (data === "[DONE]") {
              streaming = false;
              break;
            }
            active.text += data === "" ? "\n" : data;
            setStreamingBubbleContent(active.bubble, active.text, true);
            $("#thread").scrollTop = $("#thread").scrollHeight;
          }
        }

        finalizeActiveStream({ keepText: true, speakText: true });
      } catch (error) {
        if (error.name === "AbortError") {
          finalizeActiveStream({ keepText: true, speakText: false });
          return;
        }
        const hadStream = state.activeStream && state.activeStream.text.trim();
        if (state.activeStream) {
          finalizeActiveStream({ keepText: true, speakText: false });
        }
        if (!hadStream) {
          appendBotMessage(error.message || "Request failed.");
        }
      }
    }

    function switchLanguage(language) {
      if (!I18N[language]) {
        return;
      }
      stopSpeaking();
      stopActiveStream();
      if (state.recognition && state.listening) {
        try {
          state.recognition.stop();
        } catch (_error) {}
      }
      state.language = language;
      renderStaticText();
      renderStatus();
      resetConversation();
      if (state.recognition) {
        state.recognition.lang = voiceLocales[state.language];
      }
    }

    function setupRecognition() {
      const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Recognition) {
        $("#voice-status").textContent = "Speech recognition unavailable in this browser.";
        return;
      }
      const recognition = new Recognition();
      recognition.lang = voiceLocales[state.language];
      recognition.interimResults = false;
      recognition.continuous = false;
      recognition.onstart = () => {
        state.listening = true;
        $("#mic-btn").classList.add("active");
        $("#voice-status").textContent = t("voiceListening");
        if (state.speaking) {
          stopSpeaking();
        }
      };
      recognition.onend = () => {
        state.listening = false;
        $("#mic-btn").classList.remove("active");
        if (!state.speaking) {
          $("#voice-status").textContent = t("voiceReady");
        }
      };
      recognition.onerror = () => {
        state.listening = false;
        $("#mic-btn").classList.remove("active");
        $("#voice-status").textContent = t("voiceReady");
      };
      recognition.onresult = event => {
        const transcript = Array.from(event.results).map(item => item[0].transcript).join(" ").trim();
        if (!transcript) {
          return;
        }
        if (state.callOpen) {
          appendCallTranscript(`Farmer: ${transcript}`);
        }
        $("#message-input").value = transcript;
        autoResize($("#message-input"));
        sendMessage(transcript);
        $("#message-input").value = "";
        autoResize($("#message-input"));
      };
      state.recognition = recognition;
    }

    function startListening() {
      if (!state.recognition) {
        return;
      }
      state.recognition.lang = voiceLocales[state.language];
      try {
        state.recognition.start();
      } catch (_error) {}
    }

    function startCallTimer() {
      stopCallTimer();
      state.callSeconds = 0;
      $("#call-timer").textContent = "00:00";
      state.callTimer = setInterval(() => {
        state.callSeconds += 1;
        const minutes = String(Math.floor(state.callSeconds / 60)).padStart(2, "0");
        const seconds = String(state.callSeconds % 60).padStart(2, "0");
        $("#call-timer").textContent = `${minutes}:${seconds}`;
      }, 1000);
    }

    function stopCallTimer() {
      if (state.callTimer) {
        clearInterval(state.callTimer);
      }
      state.callTimer = null;
    }

    function openCallModal() {
      state.callOpen = true;
      $("#call-transcript").innerHTML = "";
      $("#call-modal").classList.add("show");
      $("#call-number").textContent = state.config?.phoneNumber || "+254 700 SHAMBA";
      appendCallTranscript(t("callGreeting"));
      startCallTimer();
    }

    function closeCallModal() {
      state.callOpen = false;
      $("#call-modal").classList.remove("show");
      stopCallTimer();
      stopSpeaking();
    }

    function registerServiceWorker() {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      }
    }

    function detectGps() {
      if (!navigator.geolocation) {
        return;
      }
      navigator.geolocation.getCurrentPosition(async position => {
        state.lat = position.coords.latitude;
        state.lon = position.coords.longitude;
        try {
          await refreshContext(true);
        } catch (_error) {}
      });
    }

    function attachEvents() {
      $("#theme-btn").addEventListener("click", () => {
        document.body.classList.toggle("force-dark");
      });

      $("#send-btn").addEventListener("click", async () => {
        const message = $("#message-input").value;
        $("#message-input").value = "";
        autoResize($("#message-input"));
        await sendMessage(message);
      });

      $("#message-input").addEventListener("input", () => autoResize($("#message-input")));

      $("#message-input").addEventListener("keydown", async event => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          const message = $("#message-input").value;
          $("#message-input").value = "";
          autoResize($("#message-input"));
          await sendMessage(message);
        }
      });

      $("#mic-btn").addEventListener("click", startListening);
      $("#stop-speaking-btn").addEventListener("click", stopSpeaking);
      $("#continuous-btn").addEventListener("click", () => {
        state.continuousListening = !state.continuousListening;
        $("#continuous-btn").textContent = state.continuousListening ? t("continuousOn") : t("continuousOff");
      });
      $("#clear-chat-btn").addEventListener("click", resetConversation);
      $("#gps-btn").addEventListener("click", detectGps);
      $("#update-location-btn").addEventListener("click", async () => {
        state.currentLocation = $("#location-input").value.trim() || state.currentLocation;
        state.lat = null;
        state.lon = null;
        await refreshContext(true);
      });

      $$(".quick-chip-btn").forEach(button => {
        button.addEventListener("click", async () => {
          await sendMessage(I18N[state.language].quickPrompts[button.dataset.prompt]);
        });
      });

      $("#open-call-btn").addEventListener("click", openCallModal);
      $("#call-hangup-btn").addEventListener("click", closeCallModal);
      $("#call-mic-btn").addEventListener("click", startListening);
      $("#call-mute-btn").addEventListener("click", () => {
        state.callMuted = !state.callMuted;
        $("#call-mute-btn").textContent = state.callMuted ? `🔈 ${t("callUnmuted")}` : `🔇 ${t("callMuted")}`;
        if (state.callMuted) {
          stopSpeaking();
        }
      });
      $("#call-speaker-btn").addEventListener("click", () => {
        state.callSpeaker = !state.callSpeaker;
        $("#call-speaker-btn").textContent = state.callSpeaker ? `🔊 ${t("callSpeaker")}` : `🎧 ${t("callEarpiece")}`;
      });
    }

    async function init() {
      renderStaticText();
      setupRecognition();
      attachEvents();
      await loadConfig();
      renderStaticText();
      await refreshPrices();
      await refreshContext();
      resetConversation();
      registerServiceWorker();
      detectGps();
      if ("speechSynthesis" in window) {
        window.speechSynthesis.onvoiceschanged = () => chooseVoice();
      }
    }

    init().catch(error => {
      appendBotMessage(error.message || "Failed to initialize Shamba Assistant.");
    });
  </script>
</body>
</html>
